name: boldgenotyper
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python
  - python>=3.9,<3.14

  # External bioinformatics tools (via bioconda)
  - mafft>=7.0
  - trimal>=1.4
  - fasttree>=2.1

  # Core Python packages
  - biopython>=1.79
  - pandas>=1.3.0
  - numpy>=1.21.0
  - scipy>=1.7.0
  # Visualization
  - matplotlib>=3.4.0
  - seaborn>=0.11.0

  # Geographic analysis
  - geopandas>=0.10.0
  - cartopy>=0.20.0
  - shapely>=1.8.0
  - pyproj>=3.0.0

  # Configuration and reports
  - jinja2>=3.0.0
  - pyyaml>=5.0.0

  # pip-only packages
  - pip:
    - edlib>=1.3.9

  # MSA visualization (optional, install separately if needed)
  # - pip:
  #   - pymsaviz>=0.4.0
